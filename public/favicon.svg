<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Ring Gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" />
      <stop offset="50%" stop-color="#8b5cf6" />
      <stop offset="100%" stop-color="#ec4899" />
    </linearGradient>

    <!-- Core Gem Gradient -->
    <linearGradient id="coreGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#10b981" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Rounded Squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" stroke="rgba(255,255,255,0.12)" stroke-width="1.5" />
  
  <!-- Outer Ambient Glow Ring -->
  <circle cx="32" cy="32" r="23" stroke="url(#ringGrad)" stroke-width="2" stroke-dasharray="3 4" opacity="0.45" />

  <!-- Inner Chronometer Rotating Arc -->
  <path d="M15 32 A 17 17 0 1 1 49 32" stroke="url(#ringGrad)" stroke-width="3" stroke-linecap="round" filter="url(#glow)" />
  <path d="M49 32 A 17 17 0 0 1 20 45" stroke="url(#coreGrad)" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 3" opacity="0.7" />

  <!-- Habit Milestone Compass Nodes -->
  <circle cx="32" cy="15" r="2.5" fill="#38bdf8" filter="url(#glow)" />
  <circle cx="49" cy="32" r="2.5" fill="#ec4899" filter="url(#glow)" />
  <circle cx="32" cy="49" r="2.5" fill="#10b981" filter="url(#glow)" />
  <circle cx="15" cy="32" r="2.5" fill="#a855f7" filter="url(#glow)" />

  <!-- Central Dynamic Prism Habit Checkmark / Star Symbol -->
  <g transform="translate(32, 32)">
    <!-- Intersecting Hexagonal Shards -->
    <polygon points="0,-10 8,-4 8,5 0,11 -8,5 -8,-4" fill="url(#coreGrad)" opacity="0.9" filter="url(#glow)" />
    <!-- Dynamic Check Emblem -->
    <path d="M-4 0 L-1 3 L5 -3" stroke="#ffffff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
